# Scans the full git history for committed secrets on every PR and push to main.
# Runs the gitleaks binary directly: gitleaks-action needs a paid licence for orgs.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan
        run: ./gitleaks git . --redact --no-banner --exit-code 1
